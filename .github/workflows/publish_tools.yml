name: Publish AppEngine Tools on BaGet
 
permissions:
  contents: write
  packages: write
  
on:
  push:
    branches: [ main ]
    paths: [ 'src/AppEngine.Tools/**' ]
  workflow_dispatch:
      
env:
  NET_VERSION: '10.x'
  PROJECT_NAME: src/AppEngine.Tools
  PROJECT_FILE: AppEngine.Tools.csproj
  RELEASE_NAME: AppEngine.Tools

jobs:
  build:
    name: Publish on GitHub
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET SDK ${{ env.NET_VERSION }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.NET_VERSION }}
        dotnet-quality: 'ga'

    #- name: Build with dotnet
    #  run: dotnet build --configuration Release
    #  
    #- name: Run unit tests
    #  run: dotnet test

    - name: Nerdbank.GitVersioning 
      uses: dotnet/nbgv@v0.5
      id: nbgv
      with:        
        path: ${{ env.PROJECT_NAME }}

    - name: Package
      run: dotnet pack -c Release -o . '${{ env.PROJECT_NAME }}/${{ env.PROJECT_FILE }}'

    - name: Publish on NuGet
      run: dotnet nuget push *.nupkg -k ${{ secrets.BAGET_API_KEY }} -s http://nuget.aepserver.it/v3/index.json --allow-insecure-connections --no-symbols --skip-duplicate
